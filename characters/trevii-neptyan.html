  <script>
    // 返回从主页进入时的准确位置；直接访问此页时返回首页。
    const back = document.getElementById("return-link");
    back.addEventListener("click", function (event) {
      try {
        const previous = new URL(document.referrer);
        const home = new URL("../index.html", location.href);
        if (previous.origin === home.origin &&
            (previous.pathname === home.pathname ||
             previous.pathname === home.pathname.replace(/index\.html$/, "")) &&
            history.length > 1) {
          event.preventDefault();
          history.back();
        }
      } catch (_) { /* 直接打开页面时使用普通链接 */ }
    });
  </script>
